<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vibe Craft · 管理</title>
<style>
  :root { --ink:#0f172a; --muted:#64748b; --line:rgba(15,23,42,.1); --primary:#6366f1; --primary-dark:#4338ca; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--ink);
    font-family: 'Inter','Segoe UI',system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
    background:#eef1ff;
    background-image: radial-gradient(at 8% 6%, rgba(99,102,241,.18) 0px, transparent 45%), radial-gradient(at 95% 92%, rgba(168,85,247,.15) 0px, transparent 42%);
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 28px 20px 60px; }
  header { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:24px; }
  .brand { display:flex; align-items:center; gap:10px; font-weight:700; }
  .mark { width:34px; height:34px; border-radius:11px; background:linear-gradient(135deg,#6366f1,#a855f7); color:#fff; display:grid; place-items:center; }
  .who { font-size:13px; color:var(--muted); display:flex; align-items:center; gap:10px; }
  .btn { border:1px solid var(--line); background:rgba(255,255,255,.85); color:var(--ink); padding:8px 12px; border-radius:9px; font-size:13px; cursor:pointer; }
  .btn:hover { border-color:#c7d2fe; color:var(--primary-dark); }
  .btn.primary { background:linear-gradient(135deg,#6366f1,#7c3aed); border:0; color:#fff; }
  .btn.danger { color:#b91c1c; }
  .card { background:rgba(255,255,255,.75); border:1px solid rgba(255,255,255,.9); border-radius:18px; box-shadow:0 18px 40px -28px rgba(49,46,129,.4); padding:20px; margin-bottom:18px; backdrop-filter:blur(14px); }
  h2 { font-size:15px; margin:0 0 14px; letter-spacing:-.01em; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:9px 8px; border-bottom:1px solid rgba(15,23,42,.06); vertical-align:middle; }
  th { color:var(--muted); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.04em; }
  tr:last-child td { border-bottom:0; }
  .pill { display:inline-block; padding:2px 8px; border-radius:99px; font-size:11px; background:rgba(99,102,241,.1); color:var(--primary-dark); }
  .pill.off { background:rgba(239,68,68,.09); color:#b91c1c; }
  .pill.ok { background:rgba(16,185,129,.1); color:#047857; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  input[type=text], input[type=password], select {
    padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-size:13px; background:#fff; outline:none;
  }
  input:focus, select:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(99,102,241,.12); }
  .hint { font-size:11px; color:var(--muted); }
  .err { display:none; padding:10px 12px; border-radius:10px; background:rgba(239,68,68,.08); border:1px solid rgba(239,68,68,.2); color:#b91c1c; font-size:12.5px; margin-bottom:14px; }
  .err.on { display:block; }
  .ok { display:none; padding:10px 12px; border-radius:10px; background:rgba(16,185,129,.08); border:1px solid rgba(16,185,129,.2); color:#047857; font-size:12.5px; margin-bottom:14px; }
  .ok.on { display:block; }
  .mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; }
  .token-once { margin-top:10px; padding:10px; border-radius:10px; background:#0f172a; color:#e2e8f0; font-family:ui-monospace,monospace; font-size:12px; word-break:break-all; }
  a { color:var(--primary); text-decoration:none; }
  @media (max-width: 720px) { .wrap{padding:18px 12px 40px} table{font-size:12px} th,td{padding:8px 5px} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><span class="mark">✦</span> Vibe Craft · 管理</div>
    <div class="who">
      <span id="who-text">…</span>
      <a class="btn" href="/">返回工作台</a>
      <button class="btn" id="logout">退出</button>
    </div>
  </header>

  <div class="err" id="err"></div>
  <div class="ok" id="ok"></div>

  <section class="card">
    <h2>账号模式</h2>
    <div class="row">
      <select id="mode">
        <option value="off">off · 匿名（所有访问算 admin）</option>
        <option value="self">self · 单账号，不开放注册</option>
        <option value="public">public · 开放注册</option>
      </select>
      <label class="hint"><input type="checkbox" id="reg-open"> 开放注册</label>
      <input type="text" id="invite" placeholder="邀请码（可空）">
      <button class="btn primary" id="save-settings">保存</button>
    </div>
    <div class="hint" style="margin-top:8px">切换为 off 会跳过登录，请只在可信的本机环境使用。</div>
  </section>

  <section class="card">
    <h2>用户</h2>
    <div class="row" style="margin-bottom:12px">
      <input type="text" id="new-user" placeholder="用户名（3–32 位字母数字下划线）">
      <input type="password" id="new-pass" placeholder="初始密码（至少 8 位）">
      <select id="new-role"><option value="user">普通用户</option><option value="admin">管理员</option></select>
      <button class="btn primary" id="create-user">创建</button>
    </div>
    <table>
      <thead><tr><th>用户名</th><th>角色</th><th>状态</th><th>最后登录</th><th>操作</th></tr></thead>
      <tbody id="users"></tbody>
    </table>
  </section>

  <section class="card">
    <h2>登录会话</h2>
    <div class="row" style="margin-bottom:12px">
      <input type="text" id="session-user" placeholder="用户名（默认当前）">
      <button class="btn" id="load-sessions">查看</button>
    </div>
    <table>
      <thead><tr><th>设备</th><th>IP</th><th>登录时间</th><th>最近活跃</th><th>状态</th><th>操作</th></tr></thead>
      <tbody id="sessions"></tbody>
    </table>
  </section>

  <section class="card">
    <h2>API 令牌</h2>
    <div class="row" style="margin-bottom:12px">
      <input type="text" id="token-name" placeholder="用途，例如 script">
      <button class="btn primary" id="create-token">创建</button>
    </div>
    <div id="token-once"></div>
    <table>
      <thead><tr><th>名称</th><th>创建时间</th><th>最近使用</th><th>状态</th><th>操作</th></tr></thead>
      <tbody id="tokens"></tbody>
    </table>
  </section>
</div>
<script src="/admin.js"></script>
</body>
</html>
